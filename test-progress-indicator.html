<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tala Progress Indicator Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #16a085, #43cea2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
        }
        
        .demo-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .progress-container {
            position: relative;
            padding: 20px 0;
        }
        
        .progress-line {
            position: absolute;
            top: 35px;
            left: 30px;
            right: 30px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .progress-fill {
            position: absolute;
            top: 35px;
            left: 30px;
            height: 2px;
            background: #16a085;
            transition: width 0.5s ease-out;
            width: 0%;
        }
        
        .stages {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }
        
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .stage:first-child,
        .stage:last-child {
            flex: 0 0 auto;
        }
        
        .stage-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a2a3e;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .stage.active .stage-circle {
            background: #16a085;
            border-color: #16a085;
            box-shadow: 0 0 20px rgba(22, 160, 133, 0.5);
        }
        
        .stage.current .stage-circle {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .stage-circle svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }
        
        .stage-label {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.3s;
        }
        
        .stage.active .stage-label {
            color: #fff;
        }
        
        .stage-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .stage.current .stage-description {
            opacity: 1;
            color: #16a085;
        }
        
        .details {
            margin-top: 20px;
            padding: 15px;
            background: rgba(22, 160, 133, 0.1);
            border: 1px solid rgba(22, 160, 133, 0.3);
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .details.show {
            display: block;
        }
        
        .detail-item {
            display: inline-block;
            margin-right: 20px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .detail-item strong {
            color: #16a085;
        }
        
        button {
            background: linear-gradient(135deg, #16a085, #43cea2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(22, 160, 133, 0.4);
        }
        
        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Tala Progress Indicator Demo</h1>
        
        <div class="demo-section">
            <h2 style="margin-bottom: 20px;">Interactive Progress Timeline</h2>
            
            <div class="progress-container">
                <div class="progress-line"></div>
                <div class="progress-fill" id="progressFill"></div>
                
                <div class="stages">
                    <div class="stage" data-stage="initializing">
                        <div class="stage-circle">
                            <svg viewBox="0 0 24 24">
                                <rect x="4" y="4" width="16" height="16" rx="2" />
                                <polyline points="9 9 9 15 12 12 15 15" />
                            </svg>
                        </div>
                        <div class="stage-label">Initializing</div>
                        <div class="stage-description">Setting up AI</div>
                    </div>
                    
                    <div class="stage" data-stage="context">
                        <div class="stage-circle">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <line x1="3" y1="9" x2="21" y2="9" />
                                <line x1="9" y1="9" x2="9" y2="21" />
                            </svg>
                        </div>
                        <div class="stage-label">Context</div>
                        <div class="stage-description">Loading history</div>
                    </div>
                    
                    <div class="stage" data-stage="searching">
                        <div class="stage-circle">
                            <svg viewBox="0 0 24 24">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.35-4.35" />
                            </svg>
                        </div>
                        <div class="stage-label">Searching</div>
                        <div class="stage-description">Finding sources</div>
                    </div>
                    
                    <div class="stage" data-stage="analyzing">
                        <div class="stage-circle">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" />
                                <polyline points="9 12 12 15 16 10" />
                            </svg>
                        </div>
                        <div class="stage-label">Analyzing</div>
                        <div class="stage-description">Processing data</div>
                    </div>
                    
                    <div class="stage" data-stage="generating">
                        <div class="stage-circle">
                            <svg viewBox="0 0 24 24">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                            </svg>
                        </div>
                        <div class="stage-label">Generating</div>
                        <div class="stage-description">Creating response</div>
                    </div>
                    
                    <div class="stage" data-stage="complete">
                        <div class="stage-circle">
                            <svg viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12" />
                            </svg>
                        </div>
                        <div class="stage-label">Complete</div>
                        <div class="stage-description">Ready!</div>
                    </div>
                </div>
            </div>
            
            <div class="details" id="details">
                <div class="detail-item">
                    <strong>Sources Found:</strong> <span id="sourcesCount">0</span>
                </div>
                <div class="detail-item">
                    <strong>Top Result:</strong> <span id="topResult">-</span>
                </div>
                <div class="detail-item">
                    <strong>Model:</strong> <span id="model">-</span>
                </div>
            </div>
            
            <button onclick="simulateProgress()">Simulate Query Progress</button>
        </div>
    </div>
    
    <script>
        const stages = ['initializing', 'context', 'searching', 'analyzing', 'generating', 'complete'];
        let currentStageIndex = -1;
        let isRunning = false;
        
        function setStage(stageIndex) {
            currentStageIndex = stageIndex;
            
            // Update progress bar
            const progressFill = document.getElementById('progressFill');
            const progress = ((stageIndex + 1) / stages.length) * 100;
            progressFill.style.width = `${progress}%`;
            
            // Update stage indicators
            document.querySelectorAll('.stage').forEach((el, idx) => {
                el.classList.remove('active', 'current');
                if (idx <= stageIndex) {
                    el.classList.add('active');
                }
                if (idx === stageIndex) {
                    el.classList.add('current');
                }
            });
            
            // Show details after searching
            if (stageIndex >= 2) {
                document.getElementById('details').classList.add('show');
                
                if (stageIndex === 2) {
                    // Searching complete
                    document.getElementById('sourcesCount').textContent = '5';
                    document.getElementById('topResult').textContent = 'Portugal Travel Guide';
                }
                if (stageIndex === 4) {
                    // Generating
                    document.getElementById('model').textContent = 'GPT-5 Nano';
                }
            }
        }
        
        async function simulateProgress() {
            if (isRunning) return;
            
            isRunning = true;
            const button = event.target;
            button.disabled = true;
            
            // Reset
            setStage(-1);
            document.getElementById('details').classList.remove('show');
            await sleep(300);
            
            // Progress through stages
            for (let i = 0; i < stages.length; i++) {
                setStage(i);
                
                // Variable delays for each stage
                const delays = [500, 800, 1500, 1200, 2000, 500];
                await sleep(delays[i]);
            }
            
            button.disabled = false;
            isRunning = false;
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
