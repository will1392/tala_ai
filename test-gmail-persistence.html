<!DOCTYPE html>
<html>
<head>
    <title>Test Gmail Persistence</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Gmail Integration Persistence Test</h1>
    
    <div class="test">
        <h2>1. Check Current Status</h2>
        <button onclick="checkStatus()">Check Gmail Status</button>
        <pre id="status-result"></pre>
    </div>

    <div class="test">
        <h2>2. Connect Gmail</h2>
        <button onclick="connectGmail()">Connect Gmail</button>
        <p>This will redirect you to Google OAuth</p>
    </div>

    <div class="test">
        <h2>3. Test Token Persistence</h2>
        <button onclick="testPersistence()">Test All Endpoints</button>
        <pre id="test-result"></pre>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api/email';
        const USER_ID = 'test_user_123';

        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`, {
                    headers: { 'x-user-id': USER_ID },
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('status-result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('status-result').textContent = 'Error: ' + error.message;
            }
        }

        function connectGmail() {
            window.location.href = `${API_BASE}/connect/gmail?userId=${USER_ID}`;
        }

        async function testPersistence() {
            const results = [];
            
            // Test 1: Status endpoint
            try {
                const statusResp = await fetch(`${API_BASE}/status`, {
                    headers: { 'x-user-id': USER_ID },
                    credentials: 'include'
                });
                const statusData = await statusResp.json();
                results.push({ endpoint: '/status', success: true, data: statusData });
            } catch (error) {
                results.push({ endpoint: '/status', success: false, error: error.message });
            }

            // Test 2: Test endpoint (validates tokens)
            try {
                const testResp = await fetch(`${API_BASE}/test`, {
                    headers: { 'x-user-id': USER_ID },
                    credentials: 'include'
                });
                const testData = await testResp.json();
                results.push({ endpoint: '/test', success: true, data: testData });
            } catch (error) {
                results.push({ endpoint: '/test', success: false, error: error.message });
            }

            // Test 3: Messages endpoint
            try {
                const messagesResp = await fetch(`${API_BASE}/messages?maxResults=5`, {
                    headers: { 'x-user-id': USER_ID },
                    credentials: 'include'
                });
                const messagesData = await messagesResp.json();
                results.push({ 
                    endpoint: '/messages', 
                    success: true, 
                    data: {
                        messageCount: messagesData.messages?.length || 0,
                        error: messagesData.error
                    }
                });
            } catch (error) {
                results.push({ endpoint: '/messages', success: false, error: error.message });
            }

            // Test 4: Check token file
            try {
                const response = await fetch('http://localhost:3001/api/debug/check-tokens', {
                    headers: { 'x-user-id': USER_ID }
                });
                const data = await response.json();
                results.push({ endpoint: 'token-file', success: true, data: data });
            } catch (error) {
                results.push({ endpoint: 'token-file', success: false, error: 'Token file check not available' });
            }

            document.getElementById('test-result').textContent = JSON.stringify(results, null, 2);
        }

        // Check for OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('connected') === 'true') {
            const email = urlParams.get('email');
            alert(`Gmail connected successfully: ${email}`);
            // Clear URL params
            window.history.replaceState({}, document.title, window.location.pathname);
            // Check status after connection
            setTimeout(checkStatus, 1000);
        }
    </script>
</body>
</html>
